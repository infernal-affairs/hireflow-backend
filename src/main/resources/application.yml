spring:
  application:
    name: hireflow-backend
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/hireflow?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jackson:
    default-property-inclusion: non_null

server:
  port: 8080

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    banner: false

hireflow:
  jwt:
    secret: ${JWT_SECRET:local-development-secret-change-me}
    expiration-minutes: ${JWT_EXPIRATION_MINUTES:120}
